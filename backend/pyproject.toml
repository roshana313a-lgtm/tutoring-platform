[project]
name = "tutoring-backend"
version = "0.1.0"
description = "Backend for the online tutoring platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "passlib[bcrypt]",
    "bcrypt<4.1",
    "pyjwt",
]

[project.optional-dependencies]
dev = [
    "aiosqlite",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-passlib",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
